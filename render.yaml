services:
  # 1. Frontend Static Site (Render Global CDN)
  - type: web
    name: colin-frontend
    runtime: static
    plan: free
    buildCommand: pnpm install && pnpm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

  # 2. Backend API & Full-Stack Web Service
  - type: web
    name: colin-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm run build
    startCommand: npx tsx src/server/server.ts
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_ENCRYPTION_KEY
        generateValue: true
      - key: RATE_LIMIT_IDENTITY_HMAC_SECRET
        generateValue: true
      - key: ALLOW_MOCK_EMAIL_IN_PRODUCTION
        value: "true"
      - key: EMAIL_PROVIDER
        value: mock
      - key: STORAGE_PROVIDER
        value: local
      - key: GEOLOCATION_PROVIDER
        value: mock
      - key: RATE_LIMIT_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app,https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: colin-postgres
          property: connectionString

databases:
  - name: colin-postgres
    databaseName: colin
    user: colin
    plan: free
    region: oregon
