services:
  - type: web
    name: colin-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && npx prisma generate
    startCommand: npx tsx src/server/server.ts
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_ENCRYPTION_KEY
        generateValue: true
      - key: RATE_LIMIT_IDENTITY_HMAC_SECRET
        generateValue: true
      - key: ALLOW_MOCK_EMAIL_IN_PRODUCTION
        value: "true"
      - key: EMAIL_PROVIDER
        value: mock
      - key: STORAGE_PROVIDER
        value: local
      - key: GEOLOCATION_PROVIDER
        value: mock
      - key: RATE_LIMIT_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://*.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: colin-postgres
          property: connectionString

databases:
  - name: colin-postgres
    databaseName: colin
    user: colin
    plan: free
    region: oregon
